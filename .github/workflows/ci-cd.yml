name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  # ---------------------------------------------------------------- 1. backend quality gate
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (pytest, fails the build on any failure)
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90

  # ---------------------------------------------------------------- 2. frontend build
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ---------------------------------------------------------------- 3. source security checks
  source-security:
    name: Secrets and dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose
      - name: Python dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: JavaScript dependency audit (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------- 4. infrastructure as code
  iac:
    name: Terraform, Helm and IaC scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
      - name: Terraform fmt and validate
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate
      - uses: azure/setup-helm@v5
      - name: Helm lint and schema validation
        run: |
          for env in kind eks; do
            helm lint helm/bloodlink -f helm/bloodlink/values-$env.yaml --set image.tag=ci
            helm template bloodlink helm/bloodlink -n bloodlink -f helm/bloodlink/values-$env.yaml               --set image.tag=ci --api-versions monitoring.coreos.com/v1 > rendered-$env.yaml
          done
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.6.7             -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 /w/rendered-kind.yaml /w/rendered-eks.yaml
      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main"             | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
      - name: Misconfiguration scan (Terraform, Helm, Dockerfiles)
        run: |
          rm -f rendered-*.yaml
          # .terraform/ holds downloaded third-party modules (with their own examples), not our code.
          trivy config --severity "$TRIVY_SEVERITY" --exit-code 1 --ignorefile .trivyignore             --skip-dirs terraform/.terraform --skip-dirs terraform/bootstrap/.terraform             --helm-set image.tag=ci .

  # ---------------------------------------------------------------- 5. images: build, scan, push
  images:
    name: Build, scan and push images
    needs: [backend, frontend, source-security, iac]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v5
      - name: Image names
        id: meta
        run: |
          # GHCR repository names must be lowercase; the tag is the full commit SHA.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build images
        run: |
          for app in backend frontend; do
            docker build --build-arg GIT_SHA="$GITHUB_SHA" \
              -t "$REGISTRY/${{ steps.meta.outputs.owner }}/bloodlink-$app:${{ steps.meta.outputs.tag }}" "$app"
          done
      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
          trivy --version
      - name: Scan backend image (fail on any HIGH/CRITICAL, fixed or not)
        run: |
          trivy image --severity "$TRIVY_SEVERITY" --exit-code 1 --no-progress \
            "$REGISTRY/${{ steps.meta.outputs.owner }}/bloodlink-backend:${{ steps.meta.outputs.tag }}"
      - name: Scan frontend image (fail on any HIGH/CRITICAL, fixed or not)
        run: |
          trivy image --severity "$TRIVY_SEVERITY" --exit-code 1 --no-progress \
            "$REGISTRY/${{ steps.meta.outputs.owner }}/bloodlink-frontend:${{ steps.meta.outputs.tag }}"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker push "$REGISTRY/${{ steps.meta.outputs.owner }}/bloodlink-backend:${{ steps.meta.outputs.tag }}"
          docker push "$REGISTRY/${{ steps.meta.outputs.owner }}/bloodlink-frontend:${{ steps.meta.outputs.tag }}"
          {
            echo "### Images pushed"
            echo "- \`$REGISTRY/${{ steps.meta.outputs.owner }}/bloodlink-backend:${{ steps.meta.outputs.tag }}\`"
            echo "- \`$REGISTRY/${{ steps.meta.outputs.owner }}/bloodlink-frontend:${{ steps.meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 6. deploy to EKS
  deploy:
    name: Deploy to EKS
    needs: images
    # Runs only on main, and only while the EKS cluster exists (repository variable DEPLOY_EKS=true).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_EKS == 'true'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> short-lived AWS credentials, no access keys stored in GitHub
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'bloodlink-eks' }}
    steps:
      - uses: actions/checkout@v5
      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
      - uses: azure/setup-helm@v5
      - name: Helm upgrade
        run: |
          helm upgrade --install bloodlink ./helm/bloodlink \
            --namespace bloodlink --create-namespace \
            -f helm/bloodlink/values-eks.yaml \
            --set image.tag=${{ needs.images.outputs.tag }} \
            --set image.registry=ghcr.io/${{ needs.images.outputs.owner }} \
            --wait --timeout 10m
      - name: Smoke test
        run: |
          kubectl -n bloodlink rollout status deployment/bloodlink-backend --timeout=120s
          kubectl -n bloodlink get pods -o wide
          helm -n bloodlink history bloodlink --max 5
