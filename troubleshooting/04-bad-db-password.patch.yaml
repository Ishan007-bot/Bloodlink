# Scenario 4: the database URL in the Secret has the wrong password.
#   kubectl patch secret bloodlink-db -n bloodlink --patch-file troubleshooting/04-bad-db-password.patch.yaml
#   kubectl rollout restart deployment/bloodlink-backend -n bloodlink
# New pods fail in the "migrate" init container; the old pods keep serving traffic
# because the rollout uses maxUnavailable: 0. See docs/RUNBOOK.md, scenario 4.
stringData:
  database-url: postgresql+psycopg://bloodlink:wrong-password@bloodlink-postgres:5432/bloodlink
