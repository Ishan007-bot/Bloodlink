# Local Kubernetes for development and the live demo:
#   kind create cluster --config k8s/kind-config.yaml
# One control-plane node labelled for ingress-nginx, one worker, and host ports 80/443
# mapped so the Ingress answers on http://bloodlink.localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bloodlink
# Laptop disks are slow: etcd skips fsync (fine for a throwaway cluster) and the scheduler and
# controller-manager get longer leader-election leases, so a slow write does not restart them.
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    etcd:
      local:
        extraArgs:
          - name: unsafe-no-fsync
            value: "true"
    scheduler:
      extraArgs:
        - name: leader-elect-lease-duration
          value: 60s
        - name: leader-elect-renew-deadline
          value: 40s
    controllerManager:
      extraArgs:
        - name: enable-hostpath-provisioner   # kind's default, kept because lists are replaced
          value: "true"
        - name: leader-elect-lease-duration
          value: 60s
        - name: leader-elect-renew-deadline
          value: 40s
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
