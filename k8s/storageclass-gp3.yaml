# EKS: encrypted gp3 EBS volumes through the EBS CSI driver (installed as an EKS add-on by Terraform).
# WaitForFirstConsumer creates each volume in the availability zone where its pod is scheduled.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
