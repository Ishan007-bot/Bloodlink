{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up by the Grafana sidecar in kube-prometheus-stack (label grafana_dashboard=1),
# so the dashboard appears automatically: no manual import.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bloodlink.fullname" . }}-dashboard
  labels:
    {{- include "bloodlink.labels" . | nindent 4 }}
    {{- toYaml .Values.monitoring.grafanaDashboard.labels | nindent 4 }}
data:
  bloodlink-overview.json: |-
    {{- .Files.Get "files/grafana-dashboard.json" | nindent 4 }}
{{- end }}
