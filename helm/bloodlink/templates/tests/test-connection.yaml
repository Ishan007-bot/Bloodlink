{{- $fullname := include "bloodlink.fullname" . -}}
# `helm test bloodlink -n bloodlink`: checks the frontend, the backend's database
# readiness, and that the frontend proxies /api to the backend.
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test-connection
  labels:
    {{- include "bloodlink.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- include "bloodlink.podSecurityContext" (dict "uid" 65534) | nindent 4 }}
  containers:
    - name: check
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -e
          wget -qO- http://{{ $fullname }}-frontend/healthz
          wget -qO- http://{{ $fullname }}-backend:{{ .Values.backend.port }}/ready; echo
          wget -qO- http://{{ $fullname }}-frontend/api/stats; echo
          echo "all checks passed"
      securityContext:
        {{- include "bloodlink.containerSecurityContext" . | nindent 8 }}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
