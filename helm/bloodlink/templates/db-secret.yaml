{{- if not .Values.postgresql.auth.existingSecret }}
{{- $name := include "bloodlink.dbSecretName" . }}
{{- $auth := .Values.postgresql.auth }}
{{- $password := $auth.password }}
{{- if not $password }}
{{- /* Reuse the password from a previous install so upgrades never lock the app out. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bloodlink.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    # Keep the credentials if the release is uninstalled, so the data volume stays usable.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ $auth.username | quote }}
  database: {{ $auth.database | quote }}
  password: {{ $password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" $auth.username $password (include "bloodlink.dbHost" .) $auth.database | quote }}
{{- end }}
